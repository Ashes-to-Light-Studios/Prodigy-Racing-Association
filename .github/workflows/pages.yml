name: Deploy static site to Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Refresh the home-page highlights from the stats hub every three hours.
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir _site
          cp *.html *.png .nojekyll _site/
          cp CNAME _site/
          [ -d assets ] && cp -r assets _site/ || true

      - name: Refresh highlights from the stats hub
        # A hub outage should never block a deploy; the page keeps its last
        # rendered highlights and this step simply reports the failure.
        continue-on-error: true
        run: python3 scripts/update_highlights.py _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
